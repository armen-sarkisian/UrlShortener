<form class="add-form" [formGroup]="form" (ngSubmit)="submit()">
  <label for="url">New address</label>
  <div class="row">
    <input
      id="url"
      type="text"
      formControlName="url"
      placeholder="https://example.com/a/very/long/address"
      autocomplete="off"
    />
    <button type="submit" [disabled]="form.invalid || pending()">
      {{ pending() ? 'Shortening…' : 'Shorten' }}
    </button>
  </div>
</form>
